# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2
project_name: floww

before:
  hooks:
    - go mod tidy

builds:
  - id: floww
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/dagimg-dot/floww/internal/utils.Version={{.Version}}
    main: ./cmd/floww
    binary: floww

archives:
  - id: floww
    ids: [floww]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: dagimg-dot
    name: floww
